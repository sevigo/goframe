name: GoFrame CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Verify Dependencies
        run: |
          go mod tidy
          if [[ -n $(git status -s) ]]; then
            echo "go.mod/go.sum is not tidy. Please run 'go mod tidy' and commit the changes."
            git diff
            exit 1
          fi

      - name: Run Linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.63
          args: --timeout=5m

      - name: Run Tests
        # Run generic tests. We don't filter by -short as it's not implemented,
        # but we rely on setup-go caching to speed up builds.
        run: go test -v ./...

      - name: Build Examples
        run: make build-examples